
# Builds the downloads for every version tag (v1.2.3) and publishes them as a GitHub release:
# Linux .tar.gz, Windows .zip and setup.exe, Android .apk, and SHA256SUMS.txt.
# The same scripts you run on your PC do the work; this file only prepares each machine.
name: Release

on:
  push:
    tags: ["v*.*.*"]

# Read-only by default; only the last job may create the release.
permissions:
  contents: read

jobs:
  version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Compare the tag with the version
        run: |
          VERSION="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $VERSION in Cargo.toml"
            exit 1
          fi

  linux:
    needs: version
    # An older Ubuntu has an older C library (glibc), so the program also runs on older distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust
        run: rustup update stable && rustup default stable
      - name: Build the Linux download
        run: ./scripts/package-linux.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: target/dist/*.tar.gz
          if-no-files-found: error

  windows:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust and the Windows target
        run: |
          rustup update stable && rustup default stable
          rustup target add x86_64-pc-windows-gnu
      - name: MinGW and NSIS
        run: sudo apt-get update && sudo apt-get install --yes mingw-w64 nsis
      - name: Build the Windows downloads
        run: ./scripts/package-windows.sh
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            target/dist/*.zip
            target/dist/*-setup.exe
          if-no-files-found: error

  android:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust and the Android target
        run: |
          rustup update stable && rustup default stable
          rustup target add aarch64-linux-android
      # The machine has an Android SDK ($ANDROID_HOME); add the exact parts the script uses.
      - name: Android build tools, platform and NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "build-tools;36.1.0" "platforms;android-36" "ndk;29.0.14206865" > /dev/null
      - name: The signing key, from the repository's secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::The secret ANDROID_KEYSTORE_BASE64 is missing (Lab 22, Step 2)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
      - name: Build the APK
        env:
          CHESS_MASTER_KEYSTORE: ${{ runner.temp }}/release.jks
          CHESS_MASTER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./scripts/package-android.sh
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: target/dist/*.apk
          if-no-files-found: error

  release:
    needs: [linux, windows, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "chess-master ${GITHUB_REF_NAME#v}" \
            --generate-notes
